<style>#splash{position:fixed;inset:0;z-index:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#0d0d10;color:#fff;transition:opacity .5s ease,transform .5s ease}
#splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
#splash .sp-glow{position:absolute;width:70vmax;height:70vmax;border-radius:50%;background:radial-gradient(closest-side,rgba(255,45,85,.28),transparent);animation:spg 3s ease-in-out infinite alternate}
#splash img{position:relative;width:112px;height:112px;filter:drop-shadow(0 16px 36px rgba(255,45,85,.4));animation:spi .9s cubic-bezier(.2,.9,.25,1.2) both}
#splash .sp-name{position:relative;font:800 2.1rem/1 Inter,system-ui,sans-serif;letter-spacing:.34em;margin-right:-.34em;animation:spu .8s .25s both}
#splash .sp-tag{position:relative;font:600 .78rem/1 Inter,system-ui,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.55);animation:spu .8s .45s both}
#splash .sp-by{position:absolute;bottom:calc(26px + env(safe-area-inset-bottom));font:600 .78rem Inter,system-ui,sans-serif;letter-spacing:.06em;color:rgba(255,255,255,.45)}@keyframes spi{from{opacity:0;transform:scale(.6)}}@keyframes spu{from{opacity:0;transform:translateY(10px)}}@keyframes spg{to{transform:scale(1.12);opacity:.75}}
@media(prefers-reduced-motion:reduce){#splash *{animation:none!important}}</style>
